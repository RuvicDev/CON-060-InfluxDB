[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-influxdb-connector"
version = "1.0.0"
description = "Conector Ruvic para InfluxDB: ejecutar consultas Flux/InfluxQL, listar buckets/measurements, y consultar el esquema de una measurement"
requires-python = ">=3.10"
dependencies = [
    "influxdb-client>=1.44,<2.0",
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_influxdb_connector*"]
